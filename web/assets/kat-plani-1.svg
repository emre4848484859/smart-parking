<!-- 
  Bu SVG dosyası, otoparkın kat planını görsel olarak temsil eder.
  - `viewBox` özelliği, SVG'nin container'a sığacak şekilde ölçeklenmesini sağlar.
  - Her bir park yeri, bir grup (`<g>`) elementi içinde tanımlanmıştır.
  - Her grup, bir dikdörtgen (`<rect>`) ve bir metin (`<text>`) içerir.
  - JavaScript ile etkileşim için her grubun bir `id`'si ve `data-spot-id` özelliği bulunur.
  - CSS sınıfları (`.parking-spot-svg`, `.available`, `.occupied`) stil ve durum yönetimi için kullanılır.
-->
<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg">
  <!-- 
    SVG içine gömülmüş CSS stilleri.
    Bu stiller, park yerlerinin (boş, dolu, vurgulu) nasıl görüneceğini belirler.
    `!important` kullanımı, harici CSS dosyalarındaki stilleri ezmek için gerekebilir,
    ancak genellikle kaçınılması gereken bir pratiktir. Burada dinamik sınıf değişimlerinde
    istenilen stilin kesin olarak uygulanması için kullanılmıştır.
  -->
  <style>
    /* Park yeri gruplarına tıklanabilir imleç ver */
    .parking-spot-svg {
        cursor: pointer;
    }
    
    /* Park yerlerinin genel stilleri (dikdörtgenler için) */
    .parking-spot-svg rect {
        stroke: #ffffff; /* Kenarlık rengi */
        stroke-width: 1.5; /* Kenarlık kalınlığı */
        transition: fill 0.3s ease; /* Renk değişimlerinde yumuşak geçiş */
    }

    /* Park yerlerinin içindeki numaraların (metin) stili */
    .parking-spot-svg text {
        fill: #ffffff; /* Metin rengi */
        stroke: none; /* Metin kenarlığı olmasın */
        user-select: none; /* Kullanıcının metni seçmesini engelle */
    }

    /* BOŞ park yeri rengi */
    .parking-spot-svg.available rect {
        fill: #2a9d8f; /* Yeşil tonu */
    }

    /* DOLU park yeri rengi */
    .parking-spot-svg.occupied rect {
        fill: #e76f51; /* Kırmızı/Turuncu tonu */
    }

    /* YÖNLENDİRİLEN (en yakın) park yeri için vurgu animasyonu */
    .parking-spot-svg.highlight rect {
        animation: highlight-svg-spot 1s infinite alternate; /* Animasyonu uygula */
    }

    /* Vurgu animasyonunun tanımı (yanıp sönme efekti) */
    @keyframes highlight-svg-spot {
        from {
            fill: #f4a261; /* Animasyon başlangıç rengi */
        }
        to {
            fill: #e9c46a; /* Animasyon bitiş rengi */
        }
    }
  </style>

  <!-- OTOPARK YERLERİ -->
  <!-- Her bir <g> (grup) elementi bir park yerini temsil eder. -->
  <!-- id ve data-spot-id: JavaScript tarafından bu park yerini tanımak için kullanılır. -->
  <!-- class: Park yerinin mevcut durumunu (available/boş, occupied/dolu) belirtir. -->
  
