<!DOCTYPE html>
<html lang="tr">
<head>
    <!-- sayfanın karakter kodlamasını utf-8 olarak ayarlar, türkçe karakterlerin doğru görüntülenmesini sağlar -->
    <meta charset="UTF-8">
    <!-- sayfanın mobil cihazlarda ve farklı ekran boyutlarında nasıl görüneceğini kontrol eder -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- tarayıcı sekmesinde görünecek olan sayfa başlığı -->
    <title>akıllı otopark simülasyonu</title>
    
    <!-- bootstrap css framework'ünü cdn üzerinden sayfaya dahil eder, hazır stiller ve bileşenler sunar -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- font awesome ikon kütüphanesini cdn üzerinden ekler, projenin çeşitli yerlerinde ikon kullanılmasını sağlar -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- projeye özel stilleri içeren harici css dosyası -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- sayfanın ana içeriğini ortalayan ve kenar boşlukları veren bootstrap container sınıfı -->
    <div class="container my-5">
        
        <!-- sayfanın üst kısmında yer alan başlık bölümü -->
        <header class="text-center mb-5">
            <!-- ana başlık, bootstrap sınıfları ile stilize edilmiş -->
            <h1 class="display-4 fw-bold">akıllı otopark yönetim paneli</h1>
        </header>

        <!-- otoparkın genel durumunu gösteren istatistik kartlarını içeren satır -->
        <div class="row g-4 info-panel-cards">
            <!-- toplam park yeri kartı -->
            <div class="col-lg-3 col-md-6">
                <div class="stat-card h-100">
                    <div class="stat-card-icon bg-primary"><i class="fas fa-car"></i></div>
                    <div class="stat-card-info">
                        <h6 class="text-muted mb-1">toplam park yeri</h6>
                        <!-- javascript tarafından güncellenecek olan toplam park yeri sayısı -->
                        <h3 class="fw-bold" id="total-park-spots">0</h3>
                    </div>
                </div>
            </div>
            <!-- dolu park yeri kartı -->
            <div class="col-lg-3 col-md-6">
                <div class="stat-card h-100">
                    <div class="stat-card-icon bg-danger"><i class="fas fa-times-circle"></i></div>
                    <div class="stat-card-info">
                        <h6 class="text-muted mb-1">dolu park yeri</h6>
                        <!-- javascript tarafından güncellenecek olan dolu park yeri sayısı -->
                        <h3 class="fw-bold" id="occupied-park-spots">0</h3>
                    </div>
                </div>
            </div>
            <!-- boş park yeri kartı -->
            <div class="col-lg-3 col-md-6">
                <div class="stat-card h-100">
                    <div class="stat-card-icon bg-success"><i class="fas fa-check-circle"></i></div>
                    <div class="stat-card-info">
                        <h6 class="text-muted mb-1">boş park yeri</h6>
                        <!-- javascript tarafından güncellenecek olan boş park yeri sayısı -->
                        <h3 class="fw-bold" id="available-park-spots">0</h3>
                    </div>
                </div>
            </div>
            <!-- doluluk oranı kartı -->
            <div class="col-lg-3 col-md-6">
                <div class="stat-card h-100">
                    <div class="stat-card-icon bg-warning"><i class="fas fa-percentage"></i></div>
                    <div class="stat-card-info">
                        <h6 class="text-muted mb-1">doluluk oranı</h6>
                        <!-- javascript tarafından güncellenecek olan doluluk oranı -->
                        <h3 class="fw-bold" id="occupancy-rate">0%</h3>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- otopark kat planları ve kontrol panelini içeren ana satır -->
        <div class="row mt-5">
            
            <!-- sol taraf: kat planlarının gösterildiği bölüm -->
            <div class="col-lg-9">
                <div class="card shadow-sm">
                    <!-- katlar arasında geçiş yapmak için kullanılan sekmelerin (tabs) başlıkları -->
                    <div class="card-header">
                        <ul class="nav nav-tabs card-header-tabs" id="floor-tabs" role="tablist">
                            <!-- kat 1 sekmesi -->
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="floor-1-tab" data-bs-toggle="tab" data-bs-target="#floor-1-pane" type="button" role="tab" aria-controls="floor-1-pane" aria-selected="true">kat 1</button>
                            </li>
                            <!-- kat 2 sekmesi -->
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="floor-2-tab" data-bs-toggle="tab" data-bs-target="#floor-2-pane" type="button" role="tab" aria-controls="floor-2-pane" aria-selected="false">kat 2</button>
                            </li>
                            <!-- kat 3 sekmesi -->
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="floor-3-tab" data-bs-toggle="tab" data-bs-target="#floor-3-pane" type="button" role="tab" aria-controls="floor-3-pane" aria-selected="false">kat 3</button>
                            </li>
                        </ul>
                    </div>
                    <!-- sekmelerin içeriğinin bulunduğu alan -->
                    <div class="card-body">
                        <div class="tab-content" id="floor-tab-content">
                            <!-- kat 1 içeriği -->
                            <div class="tab-pane fade show active" id="floor-1-pane" role="tabpanel" aria-labelledby="floor-1-tab">
                                <div class="parking-lot-container">
                                    <!-- 1. katın svg planını yüklemek için kullanılan object etiketi. javascript bu etiketin içeriğine erişir. -->
                                    <object class="svg-object" id="svg-object-1" type="image/svg+xml" data="kat-plani-1.svg" aria-label="1. kat otopark planı"></object>
                                </div>
                            </div>
                            <!-- kat 2 içeriği -->
                            <div class="tab-pane fade" id="floor-2-pane" role="tabpanel" aria-labelledby="floor-2-tab">
                                <div class="parking-lot-container">
                                    <!-- 2. katın svg planını yüklemek için kullanılan object etiketi. -->
                                    <object class="svg-object" id="svg-object-2" type="image/svg+xml" data="kat-plani-2.svg" aria-label="2. kat otopark planı"></object>
                                </div>
                            </div>
                            <!-- kat 3 içeriği -->
                            <div class="tab-pane fade" id="floor-3-pane" role="tabpanel" aria-labelledby="floor-3-tab">
                                 <div class="parking-lot-container">
                                    <!-- 3. katın svg planını yüklemek için kullanılan object etiketi. -->
                                    <object class="svg-object" id="svg-object-3" type="image/svg+xml" data="kat-plani-3.svg" aria-label="3. kat otopark planı"></object>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- sağ taraf: simülasyon kontrolleri ve en yakın boş yer bilgisini içeren bölüm -->
            <div class="col-lg-3">
                <!-- simülasyon kontrol kartı -->
                <div class="card shadow-sm mb-4">
                    <div class="card-header fw-bold">simülasyon kontrolü</div>
                    <div class="card-body text-center">
                        <p class="text-muted small">simülasyonu başlatarak otopark doluluğunu anlık olarak değiştirin.</p>
                        <div class="d-grid gap-2">
                            <!-- simülasyonu başlatan buton -->
                            <button id="start-simulation-btn" class="btn btn-primary"><i class="fas fa-play me-2"></i>başlat</button>
                            <!-- simülasyonu durduran buton -->
                            <button id="stop-simulation-btn" class="btn btn-outline-secondary"><i class="fas fa-stop me-2"></i>durdur</button>
                        </div>
                    </div>
                </div>
                <!-- en yakın boş yer bilgi kartı -->
                <div class="card shadow-sm text-center bg-info text-white">
                    <div class="card-header fw-bold">en yakın boş yer</div>
                    <div class="card-body">
                        <i class="fas fa-map-marker-alt fa-2x mb-2"></i>
                        <!-- javascript tarafından güncellenecek olan en yakın boş yer bilgisi -->
                        <h4 class="fw-bold" id="nearest-spot-display">-</h4>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- bootstrap'in javascript fonksiyonlarını (örneğin sekmeler) çalıştırmak için gerekli olan script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- projenin ana javascript dosyası. `type="module"` modern javascript (import/export) kullanıldığını belirtir. -->
    <script type="module" src="script.js"></script>
</body>
</html>
